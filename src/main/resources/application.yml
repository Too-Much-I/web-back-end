spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: tosunsaeng-db
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나당 최대 크기 (필요 시 20MB 등으로 늘리세요)
      max-request-size: 10MB   # 요청 하나당 최대 크기

blog:
  anonymous:
    token-secret: ${BLOG_ANONYMOUS_TOKEN_SECRET:}
    cookie-secure: ${BLOG_ANONYMOUS_COOKIE_SECURE:true}
    cookie-max-age-days: ${BLOG_ANONYMOUS_COOKIE_MAX_AGE_DAYS:180}
  anonymous-profile:
    avatar-base-url: ${BLOG_ANONYMOUS_AVATAR_BASE_URL:}
  comment:
    abuse:
      secret: ${BLOG_COMMENT_RATE_LIMIT_SECRET:}
      enabled: ${BLOG_COMMENT_RATE_LIMIT_ENABLED:true}
      duplicate-ttl-seconds: ${BLOG_COMMENT_DUPLICATE_TTL_SECONDS:600}

newsletter:
  unsubscribe-token:
    secret: ${NEWSLETTER_UNSUBSCRIBE_TOKEN_SECRET:}
    key-id: ${NEWSLETTER_UNSUBSCRIBE_TOKEN_KEY_ID:}
  subscribe-rate-limit:
    secret: ${NEWSLETTER_SUBSCRIBE_RATE_LIMIT_SECRET:}
    enabled: ${NEWSLETTER_SUBSCRIBE_RATE_LIMIT_ENABLED:true}
  delivery:
    sending-enabled: ${NEWSLETTER_SENDING_ENABLED:false}
    email-provider: ${NEWSLETTER_EMAIL_PROVIDER:logging}
    from-email: ${NEWSLETTER_FROM_EMAIL:}
    from-name: ${NEWSLETTER_FROM_NAME:토선생}
    public-base-url: ${NEWSLETTER_PUBLIC_BASE_URL:}
    api-base-url: ${NEWSLETTER_API_BASE_URL:}
    send-delay-minutes: ${NEWSLETTER_SEND_DELAY_MINUTES:15}
    batch-size: ${NEWSLETTER_BATCH_SIZE:100}
    worker-count: ${NEWSLETTER_WORKER_COUNT:2}
    queue-capacity: ${NEWSLETTER_QUEUE_CAPACITY:100}
    claim-ttl-seconds: ${NEWSLETTER_CLAIM_TTL_SECONDS:300}
    reconciliation-delay-ms: ${NEWSLETTER_RECONCILIATION_DELAY_MS:60000}
    campaign-delay-ms: ${NEWSLETTER_CAMPAIGN_DELAY_MS:10000}
    delivery-delay-ms: ${NEWSLETTER_DELIVERY_DELAY_MS:5000}
    retry-delay-ms: ${NEWSLETTER_RETRY_DELAY_MS:30000}
    completion-delay-ms: ${NEWSLETTER_COMPLETION_DELAY_MS:30000}
    stale-recovery-delay-ms: ${NEWSLETTER_STALE_RECOVERY_DELAY_MS:60000}
    test-sending-enabled: ${NEWSLETTER_TEST_SENDING_ENABLED:false}
    test-recipient-allowlist: ${NEWSLETTER_TEST_RECIPIENT_ALLOWLIST:}
    aws-region: ${AWS_REGION:ap-northeast-2}

internal:
  api:
    enabled: ${INTERNAL_API_ENABLED:false}
    key: ${INTERNAL_API_KEY:}

jwt:
  secret: ${JWT_SECRET_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  tomcat:
    threads:
      max: 20       # 최대 톰캣 스레드 수 제한 (프리티어 메모리 폭발 방지)
      min-spare: 4  # 최소 대기 스레드 수
    max-connections: 100 # 동시에 허용할 최대 커넥션 수

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false

  # 에러 로그 중 ERROR 레벨 이상만 Sentry 이벤트로 발송
  logging:
    minimum-event-level: error

  # APM 성능 트랜잭션 수집 비율 (1.0 = 100%, 테스트할 때 1.0으로 하고 추후 운영 시 0.1~0.2 조정)
  traces-sample-rate: 1.0

  # 환경 구분 (dev, local, prod 등)
  environment: ${spring.profiles.active:local}
